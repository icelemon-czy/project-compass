schema_version: 1
template:
  name: compass-harness
  version: 0.4.0
  description: Cross-tool templates for project guidance, context, skills, and optional subagent roles.

supported_platforms:
  - codex
  - claude-code
  - opencode

sources:
  skills: ../../.agents/skills
  config: config.yaml
  installed_manifest: installed-manifest.yaml.template
  global_agents: agent-rules/AGENTS.global.md
  project_agents: agent-rules/AGENTS.project.md
  context: context
  skill_template: skills/_skill-template/SKILL.md
  subagent_template: subagents/_subagent-template.md
  subagent_examples: subagents/examples

placeholders:
  PROJECT_NAME:
    required: true
    description: Human-readable project name.
  PROJECT_SUMMARY:
    required: true
    description: One-sentence project purpose.
  SOURCE_ROOT:
    required: true
    description: Main source directory relative to the project root.
  TEST_COMMAND:
    required: true
    description: Command that runs the relevant automated tests.
  BUILD_COMMAND:
    required: false
    description: Command that builds or type-checks the project.
  LINT_COMMAND:
    required: false
    description: Command that runs lint or formatting checks.

template_placeholders:
  - SKILL_NAME
  - SKILL_DESCRIPTION
  - SKILL_TITLE
  - PRECONDITION
  - INPUT
  - STEP
  - ALLOWED_WRITE_SCOPE
  - OUTCOME
  - EVIDENCE
  - REMAINING_RISK
  - SUBAGENT_ID
  - SUBAGENT_NAME
  - SUBAGENT_DESCRIPTION
  - SUBAGENT_INSTRUCTIONS
  - SUBAGENT_PURPOSE
  - SUBAGENT_TRIGGER
  - SUBAGENT_TASK
  - SUBAGENT_SCOPE
  - SUBAGENT_EVIDENCE
  - FILESYSTEM_ACCESS
  - SHELL_ACCESS
  - NETWORK_ACCESS

conventions:
  placeholder_format: "double braces around UPPER_SNAKE_CASE"
  required_placeholder_missing: error
  optional_placeholder_missing: omit_or_discover_from_project
  relative_references: resolve_from_containing_file
  skill_directory: lowercase-hyphen-case
  skill_frontmatter_fields:
    - name
    - description
  adapter_template_suffix: .template

installation:
  canonical_root: .compass-harness
  canonical_targets:
    manifest: .compass-harness/manifest.yaml
    config: .compass-harness/config.yaml
    global_rules: .compass-harness/rules/global.md
    project_rules: .compass-harness/rules/project.md
    context: .compass-harness/context
    skills: .compass-harness/skills
    subagents: .compass-harness/subagents
  generated_adapters:
    codex:
      project_rules: AGENTS.md
      skills: .agents/skills
      subagents: .codex/agents
    claude-code:
      project_rules: CLAUDE.md
      skills: .claude/skills
      subagents: .claude/agents
    opencode:
      project_rules: AGENTS.md
      config: opencode.json
      skills: .agents/skills
      subagents: .opencode/agents
  policy:
    canonical_content_is_editable: true
    generated_adapters_are_editable: false
    generated_adapters_must_be_rebuildable: true
